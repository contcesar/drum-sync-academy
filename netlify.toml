# Netlify configuration for Drum Sync Academy
# Deploy: connect this repo in the Netlify dashboard (or `netlify deploy`).
# Netlify auto-detects Astro, but these settings make it explicit.

[build]
  command = "astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security + caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache the hashed, immutable build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old URLs from the enrollment/payment flow. Everything now goes through the
# Studio Tour (see TOUR_URL in src/data/site.js) and a single Programs page.
[[redirects]]
  from = "/book-assessment"
  to = "/studio-tour"
  status = 301

[[redirects]]
  from = "/payment"
  to = "/programs#tuition"
  status = 301

[[redirects]]
  from = "/programs/classes"
  to = "/programs#classes"
  status = 301

[[redirects]]
  from = "/programs/pdi"
  to = "/programs#pdi"
  status = 301

[[redirects]]
  from = "/programs/tuition"
  to = "/programs#tuition"
  status = 301
